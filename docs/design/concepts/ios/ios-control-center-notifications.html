<div id="ios-notification-flow" aria-label="Phác thảo Control Center và notification trên iOS">
  <style>
    #ios-notification-flow { color-scheme:light dark; --ink:light-dark(#302731,#f8f1f5); --muted:light-dark(#827983,#b7adb8); --bg:light-dark(#f5f1f3,#17151a); --phone:light-dark(#fffdfd,#252229); --surface:light-dark(#f8f3f5,#332f37); --line:light-dark(#ece4e9,#443e48); --accent:light-dark(#da829a,#ffb6c8); --soft:light-dark(#f4e4e9,#49333d); --green:light-dark(#5d9d70,#8bc99b); --shadow:0 18px 45px color-mix(in srgb,var(--ink) 14%,transparent); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #ios-notification-flow * {box-sizing:border-box}
    #ios-notification-flow .flow {display:grid;grid-template-columns:1fr 54px 1fr;grid-template-rows:auto 34px auto;align-items:center;justify-items:center;gap:12px 8px;padding:14px 0}
    #ios-notification-flow .flow figure:nth-of-type(1){grid-column:1;grid-row:1}
    #ios-notification-flow .flow .link:nth-of-type(1){grid-column:2;grid-row:1}
    #ios-notification-flow .flow figure:nth-of-type(2){grid-column:3;grid-row:1}
    #ios-notification-flow .flow .link:nth-of-type(2){grid-column:3;grid-row:2;transform:rotate(90deg);width:42px}
    #ios-notification-flow .flow figure:nth-of-type(3){grid-column:3;grid-row:3}
    #ios-notification-flow .flow .link:nth-of-type(3){grid-column:2;grid-row:3;transform:rotate(180deg)}
    #ios-notification-flow .flow figure:nth-of-type(4){grid-column:1;grid-row:3}
    #ios-notification-flow figure {margin:0;width:100%;display:grid;justify-items:center;gap:9px}
    #ios-notification-flow .phone {width:min(100%,245px);height:454px;padding:8px;border-radius:33px;border:1px solid var(--line);background:var(--phone);box-shadow:var(--shadow);overflow:hidden}
    #ios-notification-flow .screen {height:100%;border-radius:25px;padding:13px 12px 10px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--phone)}
    #ios-notification-flow .status {display:flex;justify-content:space-between;align-items:center;padding:0 5px;font-size:9px;font-weight:750;height:16px;z-index:2}
    #ios-notification-flow .signals {letter-spacing:1px;font-size:9px}
    #ios-notification-flow .head {display:flex;align-items:center;justify-content:space-between;margin:17px 2px 13px}
    #ios-notification-flow .title {font-size:19px;letter-spacing:-.5px;font-weight:750}
    #ios-notification-flow .subtitle {font-size:9px;color:var(--muted);margin-top:4px;line-height:1.35}
    #ios-notification-flow .paw {width:29px;height:29px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:16px}
    #ios-notification-flow .group {font-size:9px;font-weight:750;letter-spacing:.7px;color:var(--muted);margin:7px 2px}
    #ios-notification-flow .row {display:flex;align-items:center;gap:8px;padding:10px 9px;border-bottom:1px solid var(--line);font-size:9px}
    #ios-notification-flow .row .ico {width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:var(--surface);font-size:12px;flex:0 0 25px}
    #ios-notification-flow .row strong {font-size:9px}.row small{display:block;color:var(--muted);font-size:8px;margin-top:3px;line-height:1.3}.row .right{margin-left:auto;color:var(--muted);font-size:12px}
    #ios-notification-flow .switch {width:31px;height:18px;border-radius:20px;background:var(--green);padding:2px;display:flex;justify-content:flex-end;flex:0 0 31px}.switch i{width:14px;height:14px;border-radius:50%;background:#fff}
    #ios-notification-flow .permission {background:var(--surface);border-radius:13px;padding:10px;margin-top:11px;font-size:9px;line-height:1.4}
    #ios-notification-flow .permission b{display:block;margin-bottom:3px}.permission span{color:var(--muted)}
    #ios-notification-flow .button {border-radius:11px;padding:9px;text-align:center;background:var(--ink);color:var(--phone);font-size:9px;font-weight:700;margin-top:9px}
    #ios-notification-flow .tabs {display:flex;justify-content:space-around;margin-top:auto;padding:9px 0 1px;border-top:1px solid var(--line);font-size:8px;color:var(--muted)}
    #ios-notification-flow .tabs b{display:block;text-align:center;font-size:13px;margin-bottom:3px;font-weight:500}.tabs .on{color:var(--accent)}
    #ios-notification-flow figcaption{text-align:center;font-size:11px;font-weight:700}.caption{display:block;color:var(--muted);font-size:9px;font-weight:400;margin-top:3px;line-height:1.4}
    #ios-notification-flow .link {align-self:center;width:100%;height:24px;color:var(--muted)}
    #ios-notification-flow .down {display:none}
    #ios-notification-flow .lock {background:linear-gradient(155deg,#d9d4eb,#dce9e7 60%,#efe1e1);color:#28252e}
    #ios-notification-flow .lock .status {color:#302b3a}
    #ios-notification-flow .lock-time {text-align:center;margin-top:44px;font-size:54px;line-height:1;font-weight:250;letter-spacing:-2px;color:#353044}
    #ios-notification-flow .lock-date{text-align:center;color:#4e4859;font-size:10px;margin-top:6px}

    #ios-notification-flow .lock-label {font-size:9px;font-weight:750;color:#5a5363;margin:18px 2px 7px}
    #ios-notification-flow .notif {background:color-mix(in srgb,#fff 82%,#f3edf3);border:1px solid #fff9;border-radius:16px;padding:10px;margin-bottom:7px;box-shadow:0 5px 16px #29233512;color:#302b34}
    #ios-notification-flow .notif-top {display:flex;align-items:center;gap:6px;font-size:8px;color:#68616d}
    #ios-notification-flow .appmark {width:18px;height:18px;border-radius:6px;background:#df91a8;display:grid;place-items:center;color:#fff;font-size:11px}
    #ios-notification-flow .notif time{margin-left:auto}.notif strong{font-size:9px}.notif p{font-size:8px;color:#635d67;margin:6px 0 0;line-height:1.35}
    #ios-notification-flow .petline{display:flex;align-items:center;gap:7px;margin-top:7px;padding-top:7px;border-top:1px solid #e8dfe5;font-size:8px;color:#5f5863}    #ios-notification-flow .petline .petface{width:27px;height:27px;border-radius:50%;background:#f4decf;display:grid;place-items:center;font-size:17px;flex:0 0 27px}    #ios-notification-flow .lock-bottom{margin-top:auto;text-align:center;color:#5f5966;font-size:8px;padding-bottom:4px}
    #ios-notification-flow .expanded .hero {display:flex;align-items:center;gap:10px;background:linear-gradient(130deg,#f8e7ed,#e8efe4);border-radius:17px;padding:10px;margin:12px 0}
    #ios-notification-flow .hero-pet {width:55px;height:55px;border-radius:50%;background:#f4d3c0;display:grid;place-items:center;font-size:34px;flex:0 0 55px}
    #ios-notification-flow .hero b{font-size:10px}#ios-notification-flow .hero-copy small{display:block;font-size:8px;color:#72666e;margin-top:4px;line-height:1.35}
    #ios-notification-flow .expanded-copy {font-size:9px;line-height:1.45;color:var(--muted);padding:2px 2px 8px}
    #ios-notification-flow .action {display:flex;justify-content:space-between;padding:10px 3px;border-top:1px solid var(--line);font-size:9px;color:light-dark(#6750a4,#d4c2ff)}
    #ios-notification-flow .system-note {margin-top:auto;background:var(--surface);padding:8px;border-radius:11px;font-size:8px;color:var(--muted);line-height:1.35}
    #ios-notification-flow .footnote {max-width:690px;margin:2px auto 0;padding:10px 12px;border-radius:13px;background:var(--surface);color:var(--muted);font-size:10px;line-height:1.45;text-align:center}
    @media(max-width:640px){#ios-notification-flow .flow{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:12px 4px}#ios-notification-flow .phone{height:430px;padding:7px}#ios-notification-flow .screen{padding:11px 9px 8px}#ios-notification-flow .link{height:20px}}
    @media(max-width:460px){#ios-notification-flow .flow{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 30px auto 30px auto 30px auto}#ios-notification-flow .flow figure:nth-of-type(1){grid-column:1;grid-row:1}#ios-notification-flow .flow .link:nth-of-type(2){grid-column:1;grid-row:2;transform:rotate(90deg);width:42px}#ios-notification-flow .flow figure:nth-of-type(3){grid-column:1;grid-row:3}#ios-notification-flow .flow .link:nth-of-type(4){grid-column:1;grid-row:4;transform:rotate(90deg);width:42px}#ios-notification-flow .flow figure:nth-of-type(5){grid-column:1;grid-row:5}#ios-notification-flow .flow .link:nth-of-type(6){grid-column:1;grid-row:6;transform:rotate(90deg);width:42px}#ios-notification-flow .flow figure:nth-of-type(7){grid-column:1;grid-row:7}#ios-notification-flow .phone{width:235px;height:450px}}
  </style>
